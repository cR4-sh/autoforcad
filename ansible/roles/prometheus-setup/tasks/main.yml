---
- name: Create prometheus user
  become: true
  user:
    name: prometheus
    system: yes
    shell: /bin/false
    home: /var/lib/prometheus
    create_home: yes

- name: Create prometheus directories
  become: true
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/prometheus
    - /var/lib/prometheus
    - /var/lib/prometheus/rules

- name: Get Prometheus version
  set_fact:
    prometheus_version: "2.48.0"

- name: Download Prometheus
  become: true
  get_url:
    url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    dest: /tmp/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz
    mode: '0644'
    timeout: 60
  register: prometheus_download_result
  retries: 10
  delay: 15
  until: prometheus_download_result.failed == false
  ignore_errors: false

- name: Extract Prometheus
  become: true
  unarchive:
    src: /tmp/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz
    dest: /tmp
    remote_src: yes

- name: Copy Prometheus binaries
  become: true
  command: >
    install -m 0755 -o root -g root
    /tmp/prometheus-{{ prometheus_version }}.linux-amd64/prometheus
    /usr/local/bin/prometheus

- name: Copy promtool
  become: true
  command: >
    install -m 0755 -o root -g root
    /tmp/prometheus-{{ prometheus_version }}.linux-amd64/promtool
    /usr/local/bin/promtool

- name: Create Prometheus configuration
  become: true
  template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    mode: '0644'

- name: Create systemd service file for Prometheus
  become: true
  copy:
    dest: /etc/systemd/system/prometheus.service
    mode: '0644'
    content: |
      [Unit]
      Description=Prometheus
      After=network.target

      [Service]
      User=prometheus
      Group=prometheus
      Type=simple
      ExecStart=/usr/local/bin/prometheus \
        --config.file=/etc/prometheus/prometheus.yml \
        --storage.tsdb.path=/var/lib/prometheus \
        --storage.tsdb.retention.time=30d \
        --web.console.templates=/etc/prometheus/consoles \
        --web.console.libraries=/etc/prometheus/console_libraries \
        --web.listen-address=0.0.0.0:9090
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

- name: Set ownership for Prometheus directories
  become: true
  file:
    path: "{{ item }}"
    owner: prometheus
    group: prometheus
    mode: '0755'
    recurse: yes
  loop:
    - /var/lib/prometheus
    - /etc/prometheus

- name: Cleanup temporary files
  become: true
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz
    - /tmp/prometheus-{{ prometheus_version }}.linux-amd64

- name: Reload systemd daemon
  become: true
  systemd:
    daemon_reload: yes

- name: Enable and start Prometheus service
  become: true
  systemd:
    name: prometheus
    enabled: yes
    state: started

